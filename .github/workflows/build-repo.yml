name: Build & Publish Sarchy Pacman Repo

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build-repo.yml'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:base-devel
      options: --privileged

    steps:
      - name: Initialize Artix Pacman & Install Core Tools
        run: |
          sed -i '/^\[community\]/,/^$/d' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate artix
          pacman -Syu --noconfirm --needed base-devel git sudo gnupg tar zstd github-cli

      - name: Checkout sarchy-repo
        uses: actions/checkout@v4

      - name: Set Git Identity & Safe Directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global user.name "gt-ayush"
          git config --global user.email "gt-ayush@outlook.com"

      - name: Create Builder User & Import GPG Key for Both Root and Builder
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "Missing GPG_PRIVATE_KEY secret"; exit 1; }
          test -n "$GPG_FINGERPRINT" || { echo "Missing GPG_FINGERPRINT secret"; exit 1; }

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

          # Import GPG key & set ultimate trust for root (for repo-add --sign)
          mkdir -p /root/.gnupg && chmod 700 /root/.gnupg
          echo "allow-loopback-pinentry" >> /root/.gnupg/gpg-agent.conf
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "${GPG_FINGERPRINT}:6:" | gpg --batch --import-ownertrust

          # Import GPG key & set ultimate trust for builder (for makepkg --sign)
          sudo -H -u builder mkdir -p /home/builder/.gnupg
          sudo -H -u builder chmod 700 /home/builder/.gnupg
          echo "allow-loopback-pinentry" | sudo -H -u builder tee -a /home/builder/.gnupg/gpg-agent.conf >/dev/null
          echo "$GPG_PRIVATE_KEY" | base64 -d | sudo -H -u builder gpg --batch --import
          echo "${GPG_FINGERPRINT}:6:" | sudo -H -u builder gpg --batch --import-ownertrust

      - name: Download Existing Release Packages (Preserve Unchanged Packages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          gh release download repo --dir output --pattern "*.pkg.tar.zst*" || echo "No existing release found, starting fresh."

      - name: Compile Packages (with Upstream Git Fallback)
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          chmod +x scripts/smart-build.sh
          ./scripts/smart-build.sh

      - name: Generate Signed Pacman Repository Database
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          cd output
          ls -la *.pkg.tar.zst
          rm -f sarchy-repo.db* sarchy-repo.files* sarchy.gpg
          repo-add --sign --key "$GPG_FINGERPRINT" sarchy-repo.db.tar.gz *.pkg.tar.zst

          # Export public key so ISO builds or users can fetch it directly
          gpg --armor --export "$GPG_FINGERPRINT" > sarchy.gpg

          # Convert symlinks to real files for GitHub Releases compatibility
          cp sarchy-repo.db.tar.gz sarchy-repo.db
          cp sarchy-repo.db.tar.gz.sig sarchy-repo.db.sig
          cp sarchy-repo.files.tar.gz sarchy-repo.files
          cp sarchy-repo.files.tar.gz.sig sarchy-repo.files.sig

      - name: Publish to GitHub Release ('repo')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view repo >/dev/null 2>&1; then
            gh release upload repo output/* --clobber
          else
            gh release create repo output/* \
              --title "Sarchy Linux Official Repository" \
              --notes "Automated Runit-compatible package repository for Sarchy Linux."
          fi
